# Production stack: web (FastAPI) + db (PostgreSQL).
# Default `docker compose up -d` starts ONLY web + db.
# Add the reverse proxy with: docker compose --profile nginx up -d.
#
# Secrets come from a local .env (see .env.example):
#   SECRET_KEY — required, compose refuses to start without it.
services:
  web:
    build: .
    restart: always
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      WORKERS: "4"
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-user}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-paragonka_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      DB_POOL_SIZE: "20"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-paragonka_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-paragonka_db}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  nginx:
    profiles: ["nginx"]
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata: