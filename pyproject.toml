[project]
name = "paragonka-python"
version = "0.1.0"
description = "Paragonka CRM — multi-tenant SaaS CRM for small businesses"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "granian>=1.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.0",
    "uuid7>=0.1.0",
    "jinja2>=3.1.0",
    "alembic>=1.13.0",
    "structlog>=25.1.0",
    "python-multipart>=0.0.12",
    "bcrypt>=4.0.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.0.0",
    "aiosmtplib>=3.0.0",
    "pytailwindcss>=0.3.0",
    "boto3>=1.34.0",
]

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "httpx>=0.28.1",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.15.16",
]

# ==============================================================================
# Tool configurations
# ==============================================================================

[tool.ruff]
line-length = 88
exclude = ["alembic/versions/*"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF", "S", "C90", "N",
    "C4", "Q", "TID", "PT", "RET", "COM",
]
ignore = ["COM812"]

# RUF001/2/3 flag ambiguous unicode — false positives in a Russian-language project.
extend-ignore = ["RUF001", "RUF002", "RUF003"]

# FastAPI dependency injection calls in defaults are idiomatic.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Cookie",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# anyio>=4.14 ships a pytest plugin whose session-scoped wrapper fixture
# conflicts with pytest-asyncio (ScopeMismatch poisons the whole session).
# The suite uses pytest-asyncio exclusively, so anyio's plugin is disabled.
addopts = "-n auto -p no:anyio"
