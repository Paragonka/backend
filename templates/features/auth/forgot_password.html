{% extends "base.html" %}

{% block title %}{{ _("Сброс пароля") }} | Paragonka{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="card w-full max-w-md bg-white/60 backdrop-blur-sm shadow-sm border border-slate-200">
        <div class="card-body p-8">
            <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">{{ _("Сброс пароля") }}</h1>
            <p class="text-center text-slate-400 text-sm mb-6">{{ _("Введите email, указанный при регистрации") }}</p>

            <form method="POST" action="/app/auth/forgot-password" class="space-y-4">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Email</span>
                    </label>
                    <input type="email" name="email" class="input input-bordered w-full" placeholder="email@example.com" required />
                </div>
                <button type="submit" class="btn btn-primary w-full">{{ _("Отправить ссылку") }}</button>
            </form>

            <p class="text-center text-sm text-slate-400 mt-4">
                <a href="/app/auth/login" class="text-primary hover:underline">{{ _("Вернуться ко входу") }}</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
