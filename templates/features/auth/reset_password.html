{% extends "base.html" %}

{% block title %}{{ _("Новый пароль") }} | Paragonka{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="card w-full max-w-md bg-white/60 backdrop-blur-sm shadow-sm border border-slate-200">
        <div class="card-body p-8">
            <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">{{ _("Новый пароль") }}</h1>
            <p class="text-center text-slate-400 text-sm mb-6">{{ _("Введите новый пароль") }}</p>

            {% if error %}
            <div class="alert alert-error mb-4 text-sm">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/app/auth/reset-password" class="space-y-4">
                <input type="hidden" name="token" value="{{ token }}">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">{{ _("Новый пароль") }}</span>
                    </label>
                    <input type="password" name="password" class="input input-bordered w-full" placeholder="••••••••" minlength="8" required />
                </div>
                <button type="submit" class="btn btn-primary w-full">{{ _("Сохранить пароль") }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
